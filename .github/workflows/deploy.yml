name: Restore Previous GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset gh-pages
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git push --force origin fa79bb0b8c85db9ee2c6d128f8e9ef97e3fcf1f8:refs/heads/gh-pages
