 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]],Pd=G("zap",u2),c2={points:2680},i2=[{title:"学习中心",icon:Hl,color:"from-emerald-400 to-green-500"},{title:"考试测评",icon:Ku,color:"from-teal-400 to-emerald-500"},{title:"行为跟踪",icon:Ld,color:"from-orange-400 to-amber-500"},{title:"预警通知",icon:Ns,color:"from-rose-400 to-red-500"},{title:"更多",icon:$h,color:"from-violet-400 to-purple-500"}],s2=[{title:"反诈骗",icon:As,color:"from-red-400 to-rose-500"},{title:"交通安全",icon:Ju,color:"from-sky-400 to-blue-500"},{title:"网络安全",icon:$d,color:"from-violet-400 to-purple-500"},{title:"食品安全",icon:jh,color:"from-emerald-400 to-green-500"},{title:"校园欺凌",icon:Fd,color:"from-orange-400 to-amber-500"},{title:"心理健康",icon:Pm,color:"from-cyan-400 to-teal-500"},{title:"应急救护",icon:Pd,color:"from-pink-400 to-rose-500"}],f2={反诈骗:[{title:"识别冒充客服退款诈骗",summary:"通过案例学习“退款理赔”“订单异常”等常见话术，掌握核验方式。",tag:"重点提醒",time:"2026-07-05",read:"3分钟",content:["冒充客服退款诈骗通常会以订单异常、快递丢失、商品质量问题为由，诱导学生点击陌生链接或下载会议软件。","遇到退款理赔信息时，应回到官方平台查看订单，不向陌生人提供验证码、银行卡号和支付密码。","如果已经点击链接或填写信息，要第一时间告诉家长和老师，并冻结相关支付账户。"],tip:"凡是要求离开官方平台操作、索要验证码或引导转账的，均应立即停止。"},{title:"刷单返利为什么不能信",summary:"了解小额返利诱导、连续垫付、无法提现的诈骗链路。",tag:"反诈课堂",time:"2026-07-04",read:"4分钟",content:["刷单返利会先用小额奖励取得信任，再要求持续垫付更高金额，最后以任务未完成、账户冻结等理由拒绝提现。","学生群体容易被“轻松兼职”“高额返现”吸引，必须牢记网络兼职不能先交钱。","发现同学传播刷单链接时，应提醒其停止并及时向老师反馈。"],tip:"所有需要先付款、先充值、先垫资的兼职都要提高警惕。"},{title:"陌生链接的三步判断法",summary:"从来源、域名、要求三个角度快速判断高风险链接。",tag:"安全技巧",time:"2026-07-03",read:"2分钟",content:["第一看来源：陌生人、群聊转发和短信中的链接风险更高。","第二看域名：仿冒官网常通过相似拼写、奇怪后缀混淆视线。","第三看要求：要求登录账号、填写身份证、输入验证码的链接要格外谨慎。"],tip:"不确定的链接不要点，可以先让家长或老师帮忙判断。"}],交通安全:[{title:"上下学路上的安全观察",summary:"学习过马路、骑行、乘车时需要关注的关键风险点。",tag:"出行安全",time:"2026-07-05",read:"3分钟",content:["上下学途中要优先选择人行道和斑马线，不在车辆盲区停留。","骑行时应佩戴头盔，不逆行、不并排骑行，不边骑车边看手机。","乘坐车辆时要系好安全带，到站后确认周围安全再下车。"],tip:"慢一点、看清楚、守规则，是交通安全最有效的办法。"},{title:"认识车辆盲区",summary:"通过校园周边场景认识大型车辆右转盲区和车后盲区。",tag:"风险识别",time:"2026-07-04",read:"3分钟",content:["大型车辆转弯时存在内轮差，行人和骑行者如果贴近车辆，很容易进入司机看不到的位置。","车辆倒车时，车后低矮区域也可能处于盲区，不能在停车场和校门口追逐打闹。","经过路口时要与大型车辆保持距离，宁愿等待车辆通过后再行走。"],tip:"看不见驾驶员眼睛的位置，驾驶员也可能看不见你。"},{title:"雨天出行注意事项",summary:"掌握湿滑路面、视线受阻和积水路段的安全处理方法。",tag:"天气提醒",time:"2026-07-02",read:"2分钟",content:["雨天路面湿滑，行走和骑行都要减速，避免急停急转。","雨伞和雨衣可能遮挡视线，过马路前要多观察两侧来车。","遇到积水路段不要冒险通过，更不要靠近井盖和电力设施。"],tip:"雨天出行尽量穿颜色醒目的衣物，提高被车辆看见的概率。"}],网络安全:[{title:"保护账号密码的好习惯",summary:"学习设置强密码、开启验证和防止账号被盗的方法。",tag:"账号保护",time:"2026-07-05",read:"3分钟",content:["重要账号不要使用生日、姓名拼音和简单数字作为密码。","不同平台尽量使用不同密码，避免一个账号泄露影响多个平台。","收到异地登录提醒时，要立即修改密码并检查绑定手机和邮箱。"],tip:"验证码等同于临时密码，不能告诉任何人。"},{title:"公共 Wi-Fi 使用风险",summary:"了解公共网络下登录、支付和文件传输的安全注意事项。",tag:"网络环境",time:"2026-07-04",read:"4分钟",content:["公共 Wi-Fi 可能被伪装成免费网络，连接后存在信息被窃取的风险。","在不可信网络中，尽量不要登录重要账号或进行支付操作。","如果必须使用公共网络，应确认网络来源，并避免下载陌生文件。"],tip:"免费网络不等于安全网络，重要操作尽量使用可信网络。"},{title:"远离网络暴力和隐私泄露",summary:"认识转发截图、公开个人信息和恶意评论的风险。",tag:"网络素养",time:"2026-07-03",read:"3分钟",content:["未经允许不要发布他人的照片、聊天记录、住址和联系方式。","看到网络争吵时，不跟风攻击、不扩散未经证实的信息。","如果遭遇网络暴力，要保存证据并向家长、老师或平台求助。"],tip:"网络空间同样需要尊重他人，也要保护自己。"}],食品安全:[{title:"购买食品先看标签",summary:"识别生产日期、保质期、储存条件和配料信息。",tag:"食品识别",time:"2026-07-05",read:"2分钟",content:["购买包装食品时，应查看生产日期、保质期和包装是否完整。","发现胀袋、漏气、异味或颜色异常的食品，不要继续食用。","对过敏体质的同学，要特别关注配料表中的过敏原提示。"],tip:"来路不明、标签不清、包装破损的食品不要购买。"},{title:"校园周边小摊怎么选",summary:"从卫生环境、加工方式和食品温度判断风险。",tag:"校园饮食",time:"2026-07-04",read:"3分钟",content:["选择证照齐全、环境整洁、食材新鲜的餐饮摊点。","尽量避免购买长时间暴露在空气中、反复加热或颜色异常的食品。","饭前洗手，餐具保持清洁，是预防肠胃不适的重要习惯。"],tip:"不贪便宜、不猎奇，是保护肠胃的第一步。"},{title:"运动后饮食提醒",summary:"了解运动后补水、冷饮和高糖食品的注意事项。",tag:"健康饮食",time:"2026-07-02",read:"2分钟",content:["运动后应少量多次补水，不宜一次大量饮用冰饮。","高糖饮料不能替代日常饮水，长期大量饮用会影响健康。","运动后可以适量补充主食、蛋白质和水果，帮助身体恢复。"],tip:"口渴时优先选择温水或常温饮用水。"}],校园欺凌:[{title:"哪些行为属于校园欺凌",summary:"认识语言攻击、孤立排挤、肢体伤害和网络欺凌。",tag:"识别欺凌",time:"2026-07-05",read:"3分钟",content:["校园欺凌不仅包括打骂，也包括长期嘲笑、起侮辱性外号、恶意排挤和网络攻击。","旁观者的起哄和转发也可能加重伤害，不能把欺凌当成玩笑。","如果看到同学被欺凌，应在保证自身安全的前提下及时报告老师。"],tip:"不沉默、不围观、不参与，是制止欺凌的重要力量。"},{title:"被欺凌时如何求助",summary:"学习保存证据、远离危险和寻找可信成年人帮助。",tag:"自我保护",time:"2026-07-04",read:"3分钟",content:["遭遇欺凌时，应优先离开危险环境，不与对方发生进一步冲突。","保留聊天记录、照片、录音等证据，便于老师和家长了解情况。","告诉家长、班主任、心理老师或学校安全负责人，不要独自承受。"],tip:"求助不是软弱，而是在保护自己。"},{title:"做友善的同伴",summary:"用尊重、倾听和支持营造安全友好的班级氛围。",tag:"同伴支持",time:"2026-07-02",read:"2分钟",content:["每个人都可能有不同的性格、外貌、家庭和兴趣，差异不应该成为嘲笑理由。","当同学遇到困难时，可以用陪伴、倾听和鼓励提供支持。","班级里的友善氛围，需要每一位同学共同维护。"],tip:"一句善意提醒，可能让同学少受很多伤害。"}],心理健康:[{title:"认识压力信号",summary:"了解情绪低落、睡眠变化和注意力下降等常见压力表现。",tag:"情绪识别",time:"2026-07-05",read:"3分钟",content:["压力可能表现为烦躁、疲惫、睡不好、食欲变化和学习效率下降。","出现压力信号时，可以先记录自己的感受，找到具体的压力来源。","长期难以缓解时，应主动向家长、老师或心理老师寻求帮助。"],tip:"能说出来的情绪，往往更容易被看见和照顾。"},{title:"情绪调节小练习",summary:"学习深呼吸、暂停法和积极自我对话。",tag:"调节方法",time:"2026-07-04",read:"2分钟",content:["深呼吸可以帮助身体从紧张状态慢慢放松下来。","遇到冲突时，可以先暂停十秒，再决定如何表达自己的想法。","用“我可以一步一步来”替代“我肯定不行”，能减少无助感。"],tip:"情绪不是敌人，它是在提醒我们需要照顾自己。"},{title:"如何寻求心理支持",summary:"知道可以向谁求助，以及如何表达自己的困扰。",tag:"求助指南",time:"2026-07-03",read:"3分钟",content:["当情绪持续影响学习、睡眠和人际关系时，应及时寻求帮助。","可以向信任的家人、老师、朋友或学校心理老师说明自己的感受。","表达时可以从“最近我经常……”开始，让对方更容易理解你的状态。"],tip:"求助是一种能力，也是一种负责任的选择。"}],应急救护:[{title:"轻微擦伤如何处理",summary:"掌握清洗、消毒、包扎和观察的基本步骤。",tag:"基础救护",time:"2026-07-05",read:"3分钟",content:["轻微擦伤后，应先用流动清水冲洗伤口周围污物。","在老师或校医指导下进行消毒和覆盖，避免用手反复触碰伤口。","如果出现持续出血、红肿加重或疼痛明显，应及时就医。"],tip:"处理伤口前后都要洗手，减少感染风险。"},{title:"运动扭伤的第一时间处理",summary:"学习停止运动、冷敷、抬高和求助的处理原则。",tag:"运动救护",time:"2026-07-04",read:"3分钟",content:["发生扭伤后应立即停止运动，不要强行继续比赛或训练。","早期可在成人指导下进行冷敷，帮助减轻肿胀和疼痛。","如果无法站立、关节变形或疼痛明显，应尽快到医疗机构检查。"],tip:"不要随意按摩刚扭伤的部位，以免加重损伤。"},{title:"突发不适如何求助",summary:"知道在头晕、胸闷、呼吸困难等情况下如何及时求助。",tag:"紧急求助",time:"2026-07-03",read:"2分钟",content:["如果出现明显头晕、胸闷、呼吸困难或意识模糊，应立即告诉老师或身边同学。","在等待帮助时，应坐下或平躺，避免独自走动。","同学发现他人突发不适，应尽快通知老师和校医，不围观、不搬动不明伤情者。"],tip:"遇到紧急情况时，清楚说明地点、人数和主要症状最重要。"}]},o2=[{title:"反诈骗",count:156,icon:Hl,color:"from-red-400 to-rose-500"},{title:"交通安全",count:128,icon:Hl,color:"from-sky-400 to-blue-500"},{title:"网络安全",count:195,icon:Hl,color:"from-violet-400 to-purple-500"},{title:"食品安全",count:87,icon:Hl,color:"from-emerald-400 to-green-500"},{title:"校园欺凌",count:64,icon:Hl,color:"from-orange-400 to-amber-500"},{title:"心理健康",count:112,icon:Hl,color:"from-cyan-400 to-teal-500"},{title:"应急救护",count:93,icon:Pd,color:"from-pink-400 to-rose-500"}],t1=new Set(["反诈骗","交通安全","食品安全","校园欺凌","心理健康","应急救护"]),d2={反诈骗:[{question:"收到自称平台客服的电话，要求开启屏幕共享办理退款，正确做法是？",options:["按要求开启屏幕共享","下载对方指定的软件","把短信验证码告诉对方","挂断电话并通过官方渠道核实"],correct:3,initialAnswer:1,difficulty:2,errorRate:"18.6%",explanation:"正规平台客服不会要求开启屏幕共享或索要验证码。遇到退款、理赔信息，应挂断电话并通过平台官方入口核实。"},{question:"陌生人以“刷单返利”为由要求先垫付资金，应该怎么做？",options:["先做一单试试看","拒绝参与并保留相关信息","向同学借钱完成任务","继续充值等待返利"],correct:1,initialAnswer:0,difficulty:2,errorRate:"16.2%",explanation:"刷单本身违法，所谓返利常用小额回报骗取信任，再诱导持续转账。任何需要先付款的网络兼职都应立即停止。"},{question:"收到“中奖通知”，对方要求填写银行卡信息并支付手续费，正确做法是？",options:["立即填写信息领奖","先支付少量手续费","转发给朋友一起参加","不提供信息、不转账并核实来源"],correct:3,initialAnswer:1,difficulty:1,errorRate:"9.8%",explanation:"以中奖为由索要银行卡、验证码或手续费，是常见诈骗套路。不要点击陌生链接，也不要向对方转账。"},{question:"自称“公检法”的人要求把钱转入“安全账户”接受调查，应该怎么处理？",options:["按要求秘密转账","提供银行卡密码配合调查","立即挂断并拨打官方电话核实","删除通话记录不告诉任何人"],correct:2,initialAnswer:0,difficulty:3,errorRate:"21.4%",explanation:"公检法机关不会通过电话办案，更不存在所谓“安全账户”。应立即停止联系，并通过官方公开电话核实。"}],交通安全:[{question:"ABS是防抱死制动系统，其主要作用是？",options:["切断动力输出","自动控制方向","减轻制动惯性","防止车轮抱死"],correct:3,initialAnswer:1,difficulty:2,errorRate:"13.0%",explanation:"ABS是防抱死制动系统，作用是保护车辆在紧急制动时不发生侧滑。"},{question:"骑自行车通过没有信号灯的路口时，正确做法是？",options:["加速抢先通过","减速观察并确认安全后通过","跟在大型车辆旁边通过","低头看手机缓慢通过"],correct:1,initialAnswer:0,difficulty:1,errorRate:"8.5%",explanation:"通过路口要提前减速，观察左右来车并避开车辆盲区，确认安全后再通行。"},{question:"雨天步行过马路时，下列做法正确的是？",options:["在车辆间隙快速穿行","用雨伞完全遮住视线","走斑马线并多观察两侧来车","沿机动车道边缘行走"],correct:2,initialAnswer:1,difficulty:1,errorRate:"7.9%",explanation:"雨天路滑且视线受阻，应走人行横道，避免雨具遮挡视线，并给车辆留下更长的制动距离。"},{question:"乘坐汽车时，安全带的正确使用方法是？",options:["只在高速公路上系","从腋下穿过即可","全程规范系好安全带","后排乘客可以不系"],correct:2,initialAnswer:3,difficulty:1,errorRate:"6.7%",explanation:"无论前排还是后排、长途还是短途，都应全程规范系好安全带。"}],食品安全:[{question:"购买包装食品时，首先应该检查什么？",options:["包装颜色是否鲜艳","生产日期、保质期和包装是否完整","广告是否吸引人","赠品数量是否足够"],correct:1,initialAnswer:0,difficulty:1,errorRate:"7.2%",explanation:"购买食品应先查看生产日期、保质期、储存条件和包装完整性，发现胀袋、漏气或破损时不要购买。"},{question:"发现食品已经超过保质期，正确做法是？",options:["加热后继续食用","只吃没有变色的部分","停止食用并妥善处理","用水清洗后食用"],correct:2,initialAnswer:0,difficulty:1,errorRate:"5.4%",explanation:"过期食品可能存在微生物超标等风险，即使外观正常也不应继续食用。"},{question:"在校园周边购买小吃时，哪项选择更安全？",options:["选择证照齐全、环境整洁的商家","购买长时间暴露在空气中的食品","只看价格是否便宜","选择颜色特别鲜艳的食品"],correct:0,initialAnswer:2,difficulty:2,errorRate:"11.6%",explanation:"应选择证照齐全、加工环境整洁、食材新鲜的商家，避免购买来源不明或长时间裸露的食品。"},{question:"剧烈运动后口渴，比较合适的做法是？",options:["一次喝下大量冰饮","少量多次补充常温水","只喝高糖饮料","立即吃大量油炸食品"],correct:1,initialAnswer:0,difficulty:2,errorRate:"14.1%",explanation:"运动后应少量多次补水，避免一次大量饮用冰饮，高糖饮料也不能代替日常饮水。"}],校园欺凌:[{question:"同学长期被起侮辱性外号并遭到排挤，这属于什么行为？",options:["普通玩笑","正常竞争","校园欺凌","同学间的小秘密"],correct:2,initialAnswer:0,difficulty:2,errorRate:"12.8%",explanation:"长期嘲笑、侮辱、恶意排挤和网络攻击都可能构成校园欺凌，不能简单当作玩笑。"},{question:"遭遇校园欺凌时，最合适的处理方式是？",options:["独自忍耐","以暴力方式报复","保留证据并向可信成年人求助","在网络上公开对方全部隐私"],correct:2,initialAnswer:1,difficulty:2,errorRate:"10.9%",explanation:"应先离开危险环境，保留聊天记录、照片等证据，并及时告诉家长、老师或学校安全负责人。"},{question:"看到同学正在被欺凌，旁观者应该怎么做？",options:["起哄并拍视频","假装没看见","在确保自身安全的前提下及时报告老师","转发到班级群讨论"],correct:2,initialAnswer:1,difficulty:2,errorRate:"9.5%",explanation:"旁观者不应起哄或扩散伤害，应在确保自身安全的前提下制止风险并尽快寻求老师帮助。"},{question:"遭遇网络欺凌时，下列哪项做法正确？",options:["立即删除所有证据","继续与对方争吵","保存截图、停止回应并及时求助","公开对方住址进行反击"],correct:2,initialAnswer:1,difficulty:3,errorRate:"17.3%",explanation:"面对网络欺凌，应保存截图和链接，停止无效争吵，向家长、老师或平台举报求助。"}],心理健康:[{question:"当压力持续影响睡眠和学习时，比较合适的做法是？",options:["继续独自硬撑","主动向家长、老师或心理老师求助","用熬夜转移注意力","停止与所有人交流"],correct:1,initialAnswer:0,difficulty:2,errorRate:"12.1%",explanation:"压力长期影响睡眠、饮食或学习时，应主动寻求可信成年人的支持，必要时接受专业帮助。"},{question:"情绪紧张时，哪种方法有助于让自己平静下来？",options:["缓慢深呼吸并短暂停顿","立即与他人争辩","反复责怪自己","摔东西发泄"],correct:0,initialAnswer:3,difficulty:1,errorRate:"7.6%",explanation:"缓慢呼吸、短暂停顿和积极自我对话，有助于身体从紧张状态逐步放松。"},{question:"同学向你倾诉情绪困扰时，正确的回应是？",options:["嘲笑对方想太多","耐心倾听并鼓励其寻求帮助","把内容发到群里讨论","承诺无论什么情况都绝不告诉成年人"],correct
